services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hexonium
      POSTGRES_USER: hexonium
      POSTGRES_PASSWORD: hexonium
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://hexonium:hexonium@db:5432/hexonium
      SECRET_KEY: super-secret-key
      IBAN_ENCRYPTION_KEY: jF8m8wJxY6R2gJ8sFQpo4YHc_8j9nY3kQj3v0v8P7Q4=
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports: ["5173:5173"]
    depends_on: [backend]
